services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: overlay-sql
    # SQL Server has no ARM64 build. On Apple Silicon this runs under Rosetta
    # translation; pinning the platform here stops Docker guessing and makes
    # the requirement explicit. Harmless on Intel and on Linux.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - sqlbackup:/var/opt/mssql/backup
    restart: unless-stopped
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
        -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ingest:
    build: ./ingest
    container_name: overlay-ingest
    environment:
      DB_HOST: sqlserver
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: OverlayLab
      DATA_DIR: /data
      POLL_SECONDS: "20"
    volumes:
      - ./data:/data
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqldata:
  sqlbackup: